# Render Blueprint — DevFlow AI backend (FastAPI, native Python)
# Dashboard → New → Blueprint → connect Abelha344/DevFlow_AI
#
# Prefer native Python over Docker on the free tier: faster builds, no image OOM.
services:
  - type: web
    name: devflow-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: https://dev-flow-ai-psi.vercel.app
