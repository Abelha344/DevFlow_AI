# Render Blueprint — DevFlow AI backend (FastAPI)
# Connect this repo at https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: devflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set to your Vercel URL after frontend deploy, e.g. https://devflow-ai.vercel.app
      - key: CORS_ORIGINS
        value: https://YOUR_VERCEL_APP.vercel.app
